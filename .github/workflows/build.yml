name: Build Flipper Zero App (.fap)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: |
          python -m pip install --upgrade pip
          pip install ufbt

      - name: Configure ufbt with Momentum Firmware Directory
        run: |
          ufbt update --channel custom --url https://up.momentum-fw.dev/firmware/directory.json || ufbt update

      - name: Build FAP
        run: |
          ufbt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ble_ghost-fap
          path: dist/*.fap
